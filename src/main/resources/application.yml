app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes!!}
    expiry-minutes: 60
spring:
  ai:
    mcp:
      server:
        name: dealflow
        version: 1.0.0
        protocol: STREAMABLE
  # ... your existing application, datasource, jpa, flyway settings stay here
  application:
    name: dealflow
  datasource:
    url: jdbc:postgresql://localhost:5433/dealflow
    username: dealflow
    password: dealflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true